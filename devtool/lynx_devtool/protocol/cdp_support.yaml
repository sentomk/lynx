#
# Lynx CDP support settings:
# - `codegen: typed` generates C++ types for a Lynx-extension domain into
#   cdp_protocol.generated.{h,cc}.
# - `deviations` are shape differences from the vendored upstream schema. They
#   are applied on top of cdp_upstream/protocol.json before docs examples are
#   validated, and are exported to cdp_manifest.generated.yaml.
# See cdp_metadata_workflow.md for the field rules.

Debugger:
  deviations:
    - target: paused.parameters.reason
      kind: retyped
      as: {type: string}
      reason: The PrimJS stop-at-entry path reports stopAtEntry, which is not an upstream pause reason.

Tracing:
  deviations:
    - target: tracingComplete.parameters.isStartupTracing
      kind: added
      as: {type: boolean, optional: true}
      reason: Marks the tracingComplete event sent for a startup tracing file.

WhiteBoard:
  codegen: typed

# validation: legacy keeps the old wire text (globalProps must be an object,
# unavailable before decode when the TASM runner is missing). The domain-level
# legacy block is gone: every method is typed. replace.yaml still carries the
# method-level legacy errors.
GlobalProps:
  codegen: typed
  validation: legacy
  golden:
    file: devtool/lynx_devtool/protocol/testdata/golden/GlobalProps.golden.jsonl
    volatile:
      - path: params.timestamp
        kind: monotonic
      - path: result.timestamp
        kind: monotonic
