summary: Sends a DevTool-originated event to a Lynx VM target.
parameters:
  - name: vmType
    type: string
    description: VM target string passed to the platform facade.
  - name: event
    type: string
    description: Event name passed to the VM.
  - name: data
    type: string
    optional: true
    default: ''
    description: String payload passed with the event.
returns: []
events: []
notes:
  - Dispatches through LynxDevToolMediator to InspectorUIExecutor on the UI thread.
  - params.vmType and params.event must be strings; params.data, when present, must be a string. Invalid input returns InvalidParams (-32602).
  - Darwin wraps the payload with origin Devtool and target set to params.vmType before calling the platform delegate.
  - The handler returns an empty CDP result object after forwarding a valid request.
  - If params are valid but the platform facade is unavailable, the request fails with InternalError (-32603).
examples:
  - title: Send a VM event
    request:
      id: 1
      method: Lynx.sendVMEvent
      params:
        vmType: main
        event: DevToolRefresh
        data: '{"reason":"manual"}'
    response:
      id: 1
      result: {}
