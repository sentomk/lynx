summary: Returns all global WhiteBoard shared-data entries.
parameters: []
returns:
  - name: entries
    type: array
    description: Shared-data entries currently stored in the WhiteBoard.
  - name: 'entries[].key'
    type: string
    description: Shared-data key.
  - name: 'entries[].value'
    type: string
    description: JSON text for the shared-data value.
events: []
notes:
  - Requires WhiteBoard.enable first. Otherwise returns a CDP error with code -32000 and message WhiteBoard is not enabled.
  - Dispatches through LynxDevToolMediator to the TASM executor when available, otherwise to the JavaScript debugger.
  - If neither backend task runner is available, returns a CDP error with code -32000 and message No WhiteBoard task runner is available.
  - The native implementation does not read request params.
  - Values are returned as serialized JSON text strings.
  - Returns a CDP error with code -32000 and message Failed to get shared data! when the WhiteBoard instance is unavailable.
  - If no WhiteBoard inspector delegate is attached, returns a CDP error with code -32000 and message WhiteBoard inspector delegate is not attached.
examples:
  - title: Get all shared data
    request:
      id: 5
      method: WhiteBoard.getSharedData
    response:
      id: 5
      result:
        entries:
          - key: userName
            value: '"Ada"'
          - key: count
            value: '3'
