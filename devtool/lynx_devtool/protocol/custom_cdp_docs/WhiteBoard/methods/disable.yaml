summary: Disables WhiteBoard shared-data inspection for the current target.
parameters: []
returns: []
events: []
notes:
  - Dispatches through LynxDevToolMediator to the TASM executor when available, otherwise to the JavaScript debugger.
  - Sets the WhiteBoard inspector delegate enabled flag to false.
  - Returns an empty result object.
  - After disable succeeds, WhiteBoard data methods that require an enabled delegate return a CDP error with message WhiteBoard is not enabled.
  - An attached WhiteBoard inspector delegate is required. A missing delegate produces a server error with code -32000.
examples:
  - title: Disable WhiteBoard inspection
    request:
      id: 2
      method: WhiteBoard.disable
    response:
      id: 2
      result: {}
