summary: Removes one global WhiteBoard shared-data entry.
parameters:
  - name: key
    type: string
    description: Shared-data key to remove.
returns: []
events:
  - WhiteBoard.onSharedDataRemoved
notes:
  - Requires WhiteBoard.enable first. Otherwise returns a CDP error with code -32000 and message WhiteBoard is not enabled.
  - Dispatches through LynxDevToolMediator to the TASM executor when available, otherwise to the JavaScript debugger.
  - A missing or non-string key param returns a CDP error with code -32602 and a message naming the field, such as params.key: missing required field.
  - Returns an empty result object when the key exists and is removed.
  - Returns a CDP error with code -32602 and message The key does not exist! when the key is not present.
  - Returns a CDP error with code -32000 and message Failed to remove shared data! when the WhiteBoard instance is unavailable.
  - On success, enabled delegates receive WhiteBoard.onSharedDataRemoved with params.key.
  - An attached WhiteBoard inspector delegate is required. A missing delegate produces a server error with code -32000.
examples:
  - title: Remove one shared-data entry
    request:
      id: 6
      method: WhiteBoard.removeSharedData
      params:
        key: userName
    response:
      id: 6
      result: {}
  - title: Shared-data removed notification
    response:
      method: WhiteBoard.onSharedDataRemoved
      params:
        key: userName
  - title: Missing key
    request:
      id: 7
      method: WhiteBoard.removeSharedData
      params:
        key: missing
    response:
      id: 7
      error:
        code: -32602
        message: The key does not exist!
