# Test-only CDP contract for the code generator. See ../../cdp_metadata_workflow.md.
Fixture:
  codegen: typed

# Legacy validation: registration order, a raw unmigrated method, and Deferred.
Migrate:
  codegen: typed
  validation: legacy
  legacy:
    order: [set, reset]
    migrated: [set]

# A standard domain: only the listed upstream entries are generated.
Tree:
  codegen: typed
  methods: [getNode]
  events: [nodeChanged]
  deviations:
    - target: getNode.returns.cached
      kind: added
      as: {type: boolean, optional: true}
      reason: Exercises a deviation on a typed standard method.
